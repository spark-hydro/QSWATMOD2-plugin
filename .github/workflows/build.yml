# QSWATMOD2 CI, modeled on spark-hydro/SWAT-MODFLOW3 (.github/workflows/build.yml)
#
# tests    unit tests that need no QGIS (Linux and Windows) and a syntax check
# package  builds the ZIPs with the Linux and Windows SWAT-MODFLOW3 programs, checks them, tests install.sh
# windows  installs the full ZIP with install.ps1 (Windows PowerShell 5.1, then PowerShell 7) and runs the
#          installed swatmf3.exe on the SWAT-MODFLOW3 example model with its regression check (regress.py)
# qgis     installs the Linux ZIP with install.sh into QGIS 3.44 (qgis/qgis image), loads the plugin,
#          imports every module, runs the linking step and the Run button code on the
#          SWAT-MODFLOW3 example model

name: Build QSWATMOD2

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: numpy
        run: python -m pip install numpy

      - name: Syntax check
        # plugin_upload.py is an unused Plugin Builder template with an indentation error (not in the ZIP)
        run: python -m compileall -q -x "plugin_upload\.py" src/qswatmod scripts

      - name: Unit tests
        run: |
          python src/qswatmod/test/test_sysutil.py
          python src/qswatmod/test/test_create_swatmf.py
          python src/qswatmod/test/test_package.py

  package:
    name: package and install.sh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SWAT-MODFLOW3 programs (Linux and Windows)
        env:
          GH_TOKEN: ${{ github.token }}
          SWATMF3_PLATFORM: all
        run: scripts/fetch_swatmf3.sh

      - name: Build and check the ZIPs
        run: |
          python3 scripts/package.py --xml
          python3 scripts/package.py --linux --xml
          python3 scripts/package.py --check dist/QSWATMOD2.*[0-9].zip
          python3 scripts/package.py --check dist/QSWATMOD2.*-linux.zip
          ls -hl dist

      - name: install.sh (local ZIP, then uninstall)
        run: |
          zip=$(ls dist/QSWATMOD2.*-linux.zip)
          ./install.sh --zip "$zip" --plugins-dir "$RUNNER_TEMP/plugins"
          test -x "$RUNNER_TEMP/plugins/QSWATMOD2/FOLDER_FOR_COPY/SWAT-MODFLOW/swatmf3"
          test -f "$RUNNER_TEMP/plugins/QSWATMOD2/pyfolder/create_swatmf.py"
          "$RUNNER_TEMP/plugins/QSWATMOD2/FOLDER_FOR_COPY/SWAT-MODFLOW/swatmf3" --version
          ./install.sh --uninstall --plugins-dir "$RUNNER_TEMP/plugins"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  windows:
    name: Windows install and model run
    needs: package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SWAT-MODFLOW3 regression check and example model (data/MiddleBosque1000 only)
        uses: actions/checkout@v4
        with:
          repository: spark-hydro/SWAT-MODFLOW3
          path: swatmf3-repo
          sparse-checkout: |
            scripts
            data/MiddleBosque1000

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the ZIPs
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: install.ps1 (Windows PowerShell 5.1)
        shell: bash
        run: |
          zip=$(ls dist/QSWATMOD2.*[0-9].zip)
          plugins="$RUNNER_TEMP\\plugins"
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Zip "$zip" -PluginsDir "$plugins"
          exe="$plugins/QSWATMOD2/FOLDER_FOR_COPY/SWAT-MODFLOW/swatmf3.exe"
          test -f "$plugins/QSWATMOD2/metadata.txt"
          test -f "$plugins/QSWATMOD2/pyfolder/create_swatmf.py"
          test -f "$exe"
          "$exe" --version

      - name: Run the installed swatmf3.exe on the example model (regress.py)
        shell: bash
        run: |
          exe="$RUNNER_TEMP/plugins/QSWATMOD2/FOLDER_FOR_COPY/SWAT-MODFLOW/swatmf3.exe"
          python swatmf3-repo/scripts/regress.py "$exe" swatmf3-repo/data/MiddleBosque1000

      - name: install.ps1 (PowerShell 7 over it), then uninstall
        shell: bash
        run: |
          zip=$(ls dist/QSWATMOD2.*[0-9].zip)
          plugins="$RUNNER_TEMP\\plugins"
          pwsh -NoProfile -File install.ps1 -Zip "$zip" -PluginsDir "$plugins"
          test -f "$plugins/QSWATMOD2/FOLDER_FOR_COPY/SWAT-MODFLOW/swatmf3.exe"
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Uninstall -PluginsDir "$plugins"
          test ! -e "$plugins/QSWATMOD2"

  qgis:
    name: QGIS 3.44 (qgis/qgis image)
    needs: package
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis:3.44
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Example model (SWAT-MODFLOW3, data/MiddleBosque1000 only)
        uses: actions/checkout@v4
        with:
          repository: spark-hydro/SWAT-MODFLOW3
          path: swatmf3-repo
          sparse-checkout: data/MiddleBosque1000

      - name: Download the ZIPs
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: QGIS and Python packages
        run: |
          qgis --version 2>/dev/null || true
          python3 -c "import qgis.core; print('QGIS', qgis.core.Qgis.QGIS_VERSION)"
          missing=""
          for m in numpy pandas matplotlib scipy PIL; do
            python3 -c "import $m" 2>/dev/null || missing="$missing $m"
          done
          echo "missing Python modules:${missing:- none}"
          if [ -n "$missing" ]; then
            apt-get update -qq
            apt-get install -y -qq python3-numpy python3-pandas python3-matplotlib python3-scipy python3-pil
          fi

      - name: Install the plugin with install.sh
        run: ./install.sh --zip "$(ls dist/QSWATMOD2.*-linux.zip)" --plugins-dir "$RUNNER_TEMP/plugins"

      - name: Check the plugin in QGIS
        run: |
          python3 scripts/ci_qgis_check.py \
            --plugins-dir "$RUNNER_TEMP/plugins" \
            --tables src/qswatmod/test/data/createswatmf/plain_seed91 \
            --model swatmf3-repo/data/MiddleBosque1000
